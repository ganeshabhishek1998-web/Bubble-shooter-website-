<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Bubble Shooter</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#111827,#020617);color:white;font-family:system-ui,sans-serif;display:flex;justify-content:center;min-height:100vh;touch-action:none}.app{width:min(100%,520px);padding:14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.score{font-size:18px;font-weight:700}.btn{border:0;border-radius:12px;padding:10px 14px;background:#334155;color:white;font-weight:700}.board{position:relative;width:100%;aspect-ratio:0.72;background:#0b1220;border:2px solid #334155;border-radius:20px;overflow:hidden;box-shadow:0 12px 40px #0008}canvas{width:100%;height:100%;display:block}.hint{text-align:center;color:#94a3b8;margin-top:10px;font-size:14px}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#020617cc;text-align:center}.card{background:#172033;padding:26px;border-radius:20px}.hidden{display:none}.swipe{font-size:30px}
</style></head><body><main class="app"><div class="top"><div><b>🫧 Bubble Shooter</b><div class="score">Score: <span id="score">0</span></div></div><button class="btn" id="restart">Restart</button></div><div class="board"><canvas id="game"></canvas><div class="overlay hidden" id="over"><div class="card"><div class="swipe">🎉</div><h2>Game Over</h2><p>Score: <b id="final">0</b></p><button class="btn" id="again">Play Again</button></div></div></div><div class="hint">Swipe upward to aim • Release to shoot • Match 3+ bubbles</div></main>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),over=document.getElementById('over'),finalEl=document.getElementById('final');
let W,H,dpr,score=0,grid=[],colors=['#ef4444','#f59e0b','#22c55e','#3b82f6','#a855f7'];const R=18,GAP=2.05*R;let shooter={x:0,y:0},aim={x:0,y:-1},drag=false,start=null;
function resize(){dpr=devicePixelRatio||1;W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);shooter={x:W/2,y:H-35};draw()}function reset(){score=0;scoreEl.textContent=0;grid=[];for(let r=0;r<7;r++){grid[r]=[];for(let q=0;q<Math.floor(W/GAP)-1;q++)grid[r][q]=r<3?colors[(r+q)%colors.length]:null}over.classList.add('hidden');draw()}function pos(r,q){return{x:25+q*GAP+(r%2?R:0),y:28+r*GAP*.88}}function draw(){ctx.clearRect(0,0,W,H);for(let r=0;r<grid.length;r++)for(let q=0;q<grid[r].length;q++)if(grid[r][q])bubble(...Object.values(pos(r,q)),grid[r][q]);ctx.beginPath();ctx.moveTo(shooter.x,shooter.y);ctx.lineTo(shooter.x+aim.x*80,shooter.y+aim.y*80);ctx.strokeStyle='#fff8';ctx.lineWidth=3;ctx.stroke();bubble(shooter.x,shooter.y,colors[Math.floor(Math.random()*colors.length)]);}
function bubble(x,y,col){ctx.beginPath();ctx.arc(x,y,R,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();ctx.strokeStyle='#fff8';ctx.stroke();ctx.beginPath();ctx.arc(x-6,y-6,4,0,Math.PI*2);ctx.fillStyle='#fff9';ctx.fill()}
function shoot(){let col=colors[Math.floor(Math.random()*colors.length)],x=shooter.x,y=shooter.y;let vx=aim.x*9,vy=aim.y*9;let n=0;function step(){x+=vx;y+=vy;if(x<R||x>W-R)vx*=-1;let hit=false;for(let r=0;r<grid.length&&!hit;r++)for(let q=0;q<(grid[r]?.length||0);q++)if(grid[r][q]){let p=pos(r,q);if(Math.hypot(x-p.x,y-p.y)<R*1.8){hit=true;let nr=Math.max(0,Math.round((y-28)/(GAP*.88))),nq=Math.max(0,Math.round((x-25-(nr%2?R:0))/GAP));while(!grid[nr])grid[nr]=[];grid[nr][nq]=col;score+=10;scoreEl.textContent=score;check(nr,nq,col)}}if(y<25||hit||n++>250){draw();return}drawShot(x,y,col);requestAnimationFrame(step)}step()}
function drawShot(x,y,col){draw();bubble(x,y,col)}function check(r,q,col){let seen=new Set(),stack=[[r,q]],group=[];while(stack.length){let [a,b]=stack.pop(),k=a+','+b;if(seen.has(k))continue;seen.add(k);if(grid[a]?.[b]!==col)continue;group.push([a,b]);for(let dr=-1;dr<=1;dr++)for(let dq=-1;dq<=1;dq++)if(dr||dq)stack.push([a+dr,b+dq])}if(group.length>=3){group.forEach(([a,b])=>grid[a][b]=null);score+=group.length*20;scoreEl.textContent=score}}
c.addEventListener('pointerdown',e=>{drag=true;start={x:e.clientX,y:e.clientY}});c.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-start.x,dy=e.clientY-start.y;if(dy<0){let l=Math.hypot(dx,dy)||1;aim={x:dx/l,y:dy/l};draw()}});c.addEventListener('pointerup',e=>{if(drag){drag=false;if(start&&start.y-e.clientY>20)shoot()}});window.addEventListener('resize',resize);document.getElementById('restart').onclick=reset;document.getElementById('again').onclick=reset;resize();reset();
</script></body></html>
